name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Format, lint, and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache Cargo dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
          key: cairn-ci-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Install Rust toolchain
        run: >-
          rustup toolchain install 1.85.0
          --profile minimal
          --component clippy
          --component rustfmt

      - name: Run repository quality gate
        run: scripts/ci.sh

  bundles:
    name: Reproducible release bundles
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "release tag must be a semantic version beginning with v: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned release toolchain
        uses: ./.github/actions/setup-release-toolchain

      - name: Build release bundles
        run: scripts/build-release.sh

      - name: Verify release bundles
        run: scripts/verify-release-bundles.sh

      - name: Rebuild independently
        env:
          CAIRN_RELEASE_OUTPUT_DIR: ${{ github.workspace }}/target/release-bundles-repeat
          CAIRN_RELEASE_TARGET_DIR: ${{ github.workspace }}/target/release-build-repeat
        run: scripts/build-release.sh

      - name: Verify reproducibility
        run: |
          scripts/verify-release-bundles.sh target/release-bundles-repeat
          for first_bundle in target/release-bundles/*.tar.gz; do
            bundle_name="${first_bundle##*/}"
            cmp "$first_bundle" "target/release-bundles-repeat/$bundle_name"
            cmp "$first_bundle.sha256" "target/release-bundles-repeat/$bundle_name.sha256"
          done

      - name: Upload verified release bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cairn-release-${{ github.sha }}
          path: |
            target/release-bundles/*.tar.gz
            target/release-bundles/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  publish:
    name: Publish GitHub release
    needs:
      - quality
      - bundles
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified release bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cairn-release-${{ github.sha }}
          path: target/release-bundles

      - name: Verify downloaded checksums
        run: |
          cd target/release-bundles
          sha256sum --check --strict ./*.tar.gz.sha256

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG"
          target/release-bundles/*.tar.gz
          target/release-bundles/*.tar.gz.sha256
          --verify-tag
          --generate-notes
