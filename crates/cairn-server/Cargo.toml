[package]
name = "cairn-server"
description = "Cairn controller composition root"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["migration-runtime"]
migration-runtime = ["dep:cairn-admission", "dep:cairn-agent", "cairn-migration/agent-runtime"]

[dependencies]
cairn-admission = { workspace = true, optional = true }
cairn-agent = { workspace = true, optional = true }
cairn-control-transport.workspace = true
cairn-codec.workspace = true
cairn-execution.workspace = true
cairn-migration = { workspace = true, default-features = false }
cairn-observability.workspace = true
cairn-protocol.workspace = true
cairn-record.workspace = true
cairn-sdk.workspace = true
cairn-store-sqlite.workspace = true
cairn-verification.workspace = true
getrandom.workspace = true
rcgen.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
rustls.workspace = true
rustls-pemfile.workspace = true
subtle.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
x509-parser.workspace = true

[dev-dependencies]
cairn-worker = { path = "../cairn-worker" }
tempfile.workspace = true

[lints]
workspace = true
