schema_version = 1
rust = "1.85.0"
cargo_zigbuild = "0.21.8"
zig = "0.14.1"
uv = "0.12.5"
python = "3.12"
glibc = "2.28"
targets = ["aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
# The controller host runs the migration product, so a bundle without it cannot deploy the
# controller role. The manifest naming fewer binaries than the deployment needs is how this
# project already produced a bundle that could not be installed once.
binaries = ["cairn-cuda-migration-server", "cairn-server", "cairn-worker"]
